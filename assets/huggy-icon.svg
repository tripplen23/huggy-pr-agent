<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Huggy">
  <defs>
    <radialGradient id="faceGold" cx="36%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFF3A6"/>
      <stop offset="45%" stop-color="#FFCC4D"/>
      <stop offset="85%" stop-color="#E6A100"/>
      <stop offset="100%" stop-color="#B87900"/>
    </radialGradient>
    <linearGradient id="lensDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E323B"/>
      <stop offset="50%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#090A0D"/>
    </linearGradient>
    <clipPath id="aviatorClip">
      <path d="M9 24 C9 20, 27 20, 29 25 C30 29, 27 36, 19 36 C11 36, 8 30, 9 24 Z"/>
      <path d="M55 24 C55 20, 37 20, 35 25 C34 29, 37 36, 45 36 C53 36, 56 30, 55 24 Z"/>
    </clipPath>
  </defs>

  <!-- 3D Golden Sphere -->
  <circle cx="32" cy="32" r="29" fill="url(#faceGold)"/>
  <ellipse cx="24" cy="15" rx="11" ry="5.5" fill="#FFFFFF" opacity="0.28" transform="rotate(-14 24 15)"/>

  <!-- Confident Toothy Grin -->
  <path d="M18 41 C22 43.5, 42 43.5, 46 41 C45.5 51, 39.5 55, 32 55 C24.5 55, 18.5 51, 18 41 Z" fill="#4A2103"/>
  <path d="M19.5 41.6 C24 43.6, 40 43.6, 44.5 41.6 C44 45.6, 40.5 46.8, 32 46.8 C23.5 46.8, 20 45.6, 19.5 41.6 Z" fill="#FFFFFF"/>
  <ellipse cx="32" cy="52.2" rx="7.5" ry="3.1" fill="#F06A6A"/>
  <!-- Mouth shadow rim -->
  <path d="M18 41 C22 43.5, 42 43.5, 46 41" fill="none" stroke="#8C5300" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Subtle drop shadow under Aviators -->
  <path d="M9.5 25.5 C9.5 21.5, 27 21.5, 29 26.5 C30 30.5, 27 37.5, 19 37.5 C11 37.5, 8.5 31.5, 9.5 25.5 Z" fill="#7A4F00" opacity="0.28"/>
  <path d="M54.5 25.5 C54.5 21.5, 37 21.5, 35 26.5 C34 30.5, 37 37.5, 45 37.5 C53 37.5, 55.5 31.5, 54.5 25.5 Z" fill="#7A4F00" opacity="0.28"/>

  <!-- Aviator Temples & Double Bridge -->
  <path d="M3.5 24.5 L9.5 24.5 M54.5 24.5 L60.5 24.5" stroke="#18191D" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M26 22.2 L38 22.2" stroke="#18191D" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M28.5 25.5 Q32 23.5 35.5 25.5" fill="none" stroke="#18191D" stroke-width="2.1" stroke-linecap="round"/>

  <!-- Aviator Lenses -->
  <path d="M9 24 C9 20, 27 20, 29 25 C30 29, 27 36, 19 36 C11 36, 8 30, 9 24 Z" fill="url(#lensDark)" stroke="#18191D" stroke-width="2"/>
  <path d="M55 24 C55 20, 37 20, 35 25 C34 29, 37 36, 45 36 C53 36, 56 30, 55 24 Z" fill="url(#lensDark)" stroke="#18191D" stroke-width="2"/>

  <!-- Specular Sheen Across Lenses -->
  <g clip-path="url(#aviatorClip)">
    <polygon points="11,18 16,18 10,38 5,38" fill="#FFFFFF" opacity="0.30"/>
    <polygon points="18,18 20.5,18 14.5,38 12,38" fill="#FFFFFF" opacity="0.14"/>
    <polygon points="39,18 44,18 38,38 33,38" fill="#FFFFFF" opacity="0.30"/>
    <polygon points="46,18 48.5,18 42.5,38 40,38" fill="#FFFFFF" opacity="0.14"/>
  </g>
</svg>
