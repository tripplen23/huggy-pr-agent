# Google Vertex AI Lead (`gemini-4-carbon`) + Wingmen (`gemini-4-argon`) + OpenCode Go emergency fallback
name: Huggy
on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: huggy-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: tripplen23/huggy-pr-agent@v1
        with:
          mode: review
          model: google-vertex/gemini-4-carbon
          wingman_model: google-vertex/gemini-4-argon
          fallback_model: opencode-go/deepseek-v4.1-flash
          gcp_project: your-gcp-project-id
          gcp_location: global
          gcp_credentials_json: ${{ secrets.GOOGLE_VERTEX_CREDENTIALS }}
          api_key: ${{ secrets.OPENCODE_GO_KEY }}
          max_parallel_bundles: "4"

  command:
    if: >-
      (github.event_name == 'pull_request_review_comment' ||
       (github.event_name == 'issue_comment' && github.event.issue.pull_request)) &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, '@huggy') ||
       contains(github.event.comment.body, '/huggy') ||
       contains(github.event.comment.body, '@pi') ||
       contains(github.event.comment.body, '/pi') ||
       contains(github.event.comment.body, '/fix') ||
       contains(github.event.comment.body, '/review') ||
       contains(github.event.comment.body, '/describe') ||
       contains(github.event.comment.body, '/improve') ||
       contains(github.event.comment.body, '/ask'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: huggy-cmd-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: tripplen23/huggy-pr-agent@v1
        with:
          mode: comment
          model: google-vertex/gemini-4-carbon
          wingman_model: google-vertex/gemini-4-argon
          fallback_model: opencode-go/deepseek-v4.1-flash
          max_parallel_bundles: "4"
          gcp_project: your-gcp-project-id
          gcp_location: global
          gcp_credentials_json: ${{ secrets.GOOGLE_VERTEX_CREDENTIALS }}
          api_key: ${{ secrets.OPENCODE_GO_KEY }}
          setup_cmd: "corepack enable pnpm && pnpm install --frozen-lockfile"
          verify_cmd: "pnpm typecheck && pnpm lint && pnpm test"
