<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 108" width="600" height="108" role="img" aria-label="Huggy is reviewing this pull request">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1015"/>
      <stop offset="60%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#191610"/>
    </linearGradient>
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFCC4D" stop-opacity="0.34"/>
      <stop offset="65%" stop-color="#FFCC4D" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFCC4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hFace" cx="36%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFF4B0"/>
      <stop offset="45%" stop-color="#FFCC4D"/>
      <stop offset="85%" stop-color="#E6A100"/>
      <stop offset="100%" stop-color="#B87900"/>
    </radialGradient>
    <linearGradient id="hLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E333D"/>
      <stop offset="50%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="laserBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#946200" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFCC4D"/>
      <stop offset="50%" stop-color="#FFF5BA"/>
      <stop offset="65%" stop-color="#FFCC4D"/>
      <stop offset="100%" stop-color="#946200" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="1" y="1" width="598" height="106" rx="14"/>
    </clipPath>
    <clipPath id="huggyAviators">
      <path d="M9 24 C9 20, 27 20, 29 25 C30 29, 27 36, 19 36 C11 36, 8 30, 9 24 Z"/>
      <path d="M55 24 C55 20, 37 20, 35 25 C34 29, 37 36, 45 36 C53 36, 56 30, 55 24 Z"/>
    </clipPath>
  </defs>

  <!-- Outer Card -->
  <g clip-path="url(#cardClip)">
    <rect x="1" y="1" width="598" height="106" rx="14" fill="url(#cardBg)"/>

    <!-- Ambient Golden Spotlight Behind Huggy -->
    <circle cx="60" cy="53" r="54" fill="url(#goldAura)">
      <animate attributeName="r" values="48;58;48" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Expanding Golden Radar Ring -->
    <circle cx="60" cy="53" r="28" fill="none" stroke="#FFCC4D" stroke-width="1.2">
      <animate attributeName="r" values="26;44" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Animated 3D Golden Aviator Huggy Mascot -->
    <g transform="translate(28, 21)">
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,1; 0,-2.5; 0,1" keyTimes="0; 0.5; 1" calcMode="spline" keySplines="0.42 0 0.58 1; 0.42 0 0.58 1" dur="2.2s" repeatCount="indefinite"/>

        <!-- Sphere + Top Highlight -->
        <circle cx="32" cy="32" r="28" fill="url(#hFace)"/>
        <ellipse cx="24" cy="15" rx="10.5" ry="5" fill="#FFFFFF" opacity="0.30" transform="rotate(-14 24 15)"/>

        <!-- Confident Toothy Grin -->
        <path d="M18.5 40.8 C22.5 43.3, 41.5 43.3, 45.5 40.8 C45 50.5, 39.2 54.5, 32 54.5 C24.8 54.5, 19 50.5, 18.5 40.8 Z" fill="#4A2103"/>
        <path d="M20 41.4 C24.2 43.4, 39.8 43.4, 44 41.4 C43.5 45.3, 40.2 46.5, 32 46.5 C23.8 46.5, 20.5 45.3, 20 41.4 Z" fill="#FFFFFF"/>
        <ellipse cx="32" cy="51.8" rx="7.2" ry="3" fill="#F06A6A"/>
        <path d="M18.5 40.8 C22.5 43.3, 41.5 43.3, 45.5 40.8" fill="none" stroke="#8C5300" stroke-width="1.2" stroke-linecap="round"/>

        <!-- Aviator Shadow + Frame + Lenses -->
        <path d="M9.5 25.5 C9.5 21.5, 27 21.5, 29 26.5 C30 30.5, 27 37.2, 19 37.2 C11 37.2, 8.5 31.5, 9.5 25.5 Z" fill="#7A4F00" opacity="0.28"/>
        <path d="M54.5 25.5 C54.5 21.5, 37 21.5, 35 26.5 C34 30.5, 37 37.2, 45 37.2 C53 37.2, 55.5 31.5, 54.5 25.5 Z" fill="#7A4F00" opacity="0.28"/>
        <path d="M4 24.5 L9.5 24.5 M54.5 24.5 L60 24.5" stroke="#18191D" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M26 22.2 L38 22.2" stroke="#18191D" stroke-width="1.7" stroke-linecap="round"/>
        <path d="M28.5 25.5 Q32 23.5 35.5 25.5" fill="none" stroke="#18191D" stroke-width="2" stroke-linecap="round"/>
        <path d="M9 24 C9 20, 27 20, 29 25 C30 29, 27 36, 19 36 C11 36, 8 30, 9 24 Z" fill="url(#hLens)" stroke="#18191D" stroke-width="1.9"/>
        <path d="M55 24 C55 20, 37 20, 35 25 C34 29, 37 36, 45 36 C53 36, 56 30, 55 24 Z" fill="url(#hLens)" stroke="#18191D" stroke-width="1.9"/>

        <!-- Sweeping Light Sheen Across Aviators -->
        <g clip-path="url(#huggyAviators)">
          <polygon points="12,18 16,18 10,38 6,38" fill="#FFFFFF" opacity="0.16"/>
          <polygon points="40,18 44,18 38,38 34,38" fill="#FFFFFF" opacity="0.16"/>
          <rect x="-24" y="16" width="18" height="26" fill="url(#sheenGrad)" transform="skewX(-22)">
            <animate attributeName="x" values="-28;86;86" keyTimes="0;0.55;1" dur="2.4s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- Live Status Pill (Top Right) -->
    <rect x="478" y="16" width="104" height="22" rx="11" fill="#FFCC4D" fill-opacity="0.12" stroke="#FFCC4D" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="491" cy="27" r="3.6" fill="#FFCC4D">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="501" y="30.8" fill="#FFCC4D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.6">LIVE REVIEW</text>

    <!-- Primary Title -->
    <text x="108" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
      <tspan fill="#FFCC4D">Huggy</tspan>
      <tspan fill="#F3F4F6" font-weight="600"> is reviewing your pull request</tspan>
      <tspan fill="#FFCC4D">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/>...</tspan>
    </text>

    <!-- 3 Animated Stage Pills -->
    <!-- Stage 1 -->
    <g transform="translate(108, 56)">
      <rect width="128" height="25" rx="6" fill="#1E222D" stroke="#FFCC4D" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.85;0.18;0.18;0.85" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#262115;#1A1D26;#1A1D26;#262115" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="64" y="16.2" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">1 · Diff &amp; Hunks</text>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(244, 56)">
      <rect width="154" height="25" rx="6" fill="#1A1D26" stroke="#FFCC4D" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.18;0.85;0.18;0.18" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#1A1D26;#262115;#1A1D26;#1A1D26" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="77" y="16.2" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">2 · Callers &amp; Rubric</text>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(406, 56)">
      <rect width="152" height="25" rx="6" fill="#1A1D26" stroke="#FFCC4D" stroke-width="1">
        <animate attributeName="stroke-opacity" values="0.18;0.18;0.85;0.18" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="fill" values="#1A1D26;#1A1D26;#262115;#1A1D26" dur="3.6s" repeatCount="indefinite"/>
      </rect>
      <text x="76" y="16.2" text-anchor="middle" fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">3 · Fact-Check Judge</text>
    </g>

    <!-- Bottom Shimmering Gold Laser Track -->
    <rect x="0" y="104" width="600" height="3" fill="#1F2430"/>
    <rect x="-220" y="104" width="220" height="3" fill="url(#laserBar)">
      <animate attributeName="x" values="-220;600" dur="2.0s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Crisp Gold/Slate Outer Border -->
  <rect x="1" y="1" width="598" height="106" rx="14" fill="none" stroke="#FFCC4D" stroke-opacity="0.32" stroke-width="1.2"/>
</svg>
