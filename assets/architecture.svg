      <circle cx="26" cy="131" r="3" fill="#a855f7"/><text x="38" y="135" fill="#c9d1d9">Auto-resolve fixed threads</text>
      <circle cx="26" cy="159" r="3" fill="#a855f7"/><text x="38" y="163" fill="#c9d1d9">Sync stale PR description</text>
      <circle cx="26" cy="187" r="3" fill="#a855f7"/><text x="38" y="191" fill="#c9d1d9">Push verified @pi commits</text>
