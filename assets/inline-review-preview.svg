    <text x="56" y="389" fill="#ffa198">-         python3 "$ACTION_PATH/scripts/fetch_pr_context.py" "$RUNNER_TEMP/pr-context.md"</text>
    <rect x="37" y="397" width="964" height="24" fill="#12261e"/>
    <text x="56" y="413" fill="#56d364">+         cp -R "$ACTION_PATH/scripts" "$ACTION_PATH/prompts" "$RUNNER_TEMP/pi-action/"</text>
    <rect x="37" y="421" width="964" height="24" fill="#12261e"/>
    <text x="56" y="437" fill="#56d364">+         python3 "$RUNNER_TEMP/pi-action/scripts/fetch_pr_context.py" "$RUNNER_TEMP/pr-context.md"</text>
  </g>
