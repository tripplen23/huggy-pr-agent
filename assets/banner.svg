<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 212" width="800" height="212" role="img" aria-label="Huggy PR Agent — Repository-aware PR reviews, 1-click commit suggestions &amp; test-gated @huggy fixes">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="55%" stop-color="#12151E"/>
      <stop offset="100%" stop-color="#1A160E"/>
    </linearGradient>
    <radialGradient id="spotGold" cx="17%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#FFCC4D" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#FFCC4D" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFCC4D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bFace" cx="35%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFF5B5"/>
      <stop offset="45%" stop-color="#FFCC4D"/>
      <stop offset="85%" stop-color="#E6A100"/>
      <stop offset="100%" stop-color="#B87900"/>
    </radialGradient>
    <linearGradient id="bLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#303540"/>
      <stop offset="50%" stop-color="#14171D"/>
      <stop offset="100%" stop-color="#07080B"/>
    </linearGradient>
    <linearGradient id="bSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
    <clipPath id="bannerClip">
      <rect x="1" y="1" width="798" height="210" rx="18"/>
    </clipPath>
    <clipPath id="bAviators">
      <path d="M16 44 C16 36.5, 49.5 36.5, 53.5 46 C55.5 53.5, 49.5 67, 34.5 67 C19.5 67, 14 55.5, 16 44 Z"/>
      <path d="M104 44 C104 36.5, 70.5 36.5, 66.5 46 C64.5 53.5, 70.5 67, 85.5 67 C100.5 67, 106 55.5, 104 44 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect x="1" y="1" width="798" height="210" rx="18" fill="url(#bgGrad)"/>
    <rect x="1" y="1" width="798" height="210" fill="url(#dots)"/>
    <rect x="1" y="1" width="798" height="210" fill="url(#spotGold)"/>

    <!-- Hero 3D Golden Aviator Huggy Mascot -->
    <g transform="translate(34, 46)">
      <circle cx="60" cy="60" r="56" fill="#FFCC4D" opacity="0.10"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0,1.5; 0,-2.5; 0,1.5" dur="2.8s" repeatCount="indefinite"/>
        <circle cx="60" cy="60" r="52" fill="url(#bFace)"/>
        <ellipse cx="45" cy="28" rx="20" ry="9.5" fill="#FFFFFF" opacity="0.30" transform="rotate(-14 45 28)"/>

        <!-- Grin -->
        <path d="M34 77 C42 82, 78 82, 86 77 C85 95, 74 103, 60 103 C46 103, 35 95, 34 77 Z" fill="#4A2103"/>
        <path d="M36.8 78.2 C45 82.2, 75 82.2, 83.2 78.2 C82.2 85.5, 75.5 87.8, 60 87.8 C44.5 87.8, 37.8 85.5, 36.8 78.2 Z" fill="#FFFFFF"/>
        <ellipse cx="60" cy="97.8" rx="13.5" ry="5.6" fill="#F06A6A"/>
        <path d="M34 77 C42 82, 78 82, 86 77" fill="none" stroke="#8C5300" stroke-width="2.2" stroke-linecap="round"/>

        <!-- Aviator Shadows + Frames + Lenses -->
        <path d="M17 47 C17 39.5, 49.5 39.5, 53.5 49 C55.5 56.5, 49.5 69.5, 34.5 69.5 C19.5 69.5, 15 58.5, 17 47 Z" fill="#7A4F00" opacity="0.28"/>
        <path d="M103 47 C103 39.5, 70.5 39.5, 66.5 49 C64.5 56.5, 70.5 69.5, 85.5 69.5 C100.5 69.5, 105 58.5, 103 47 Z" fill="#7A4F00" opacity="0.28"/>
        <path d="M8 45.5 L17 45.5 M103 45.5 L112 45.5" stroke="#18191D" stroke-width="4" stroke-linecap="round"/>
        <path d="M48 41 L72 41" stroke="#18191D" stroke-width="3" stroke-linecap="round"/>
        <path d="M52.5 47 Q60 43.2 67.5 47" fill="none" stroke="#18191D" stroke-width="3.6" stroke-linecap="round"/>
        <path d="M16 44 C16 36.5, 49.5 36.5, 53.5 46 C55.5 53.5, 49.5 67, 34.5 67 C19.5 67, 14 55.5, 16 44 Z" fill="url(#bLens)" stroke="#18191D" stroke-width="3.4"/>
        <path d="M104 44 C104 36.5, 70.5 36.5, 66.5 46 C64.5 53.5, 70.5 67, 85.5 67 C100.5 67, 106 55.5, 104 44 Z" fill="url(#bLens)" stroke="#18191D" stroke-width="3.4"/>

        <g clip-path="url(#bAviators)">
          <polygon points="21,34 30,34 19,70 10,70" fill="#FFFFFF" opacity="0.20"/>
          <polygon points="73,34 82,34 71,70 62,70" fill="#FFFFFF" opacity="0.20"/>
          <rect x="-45" y="30" width="30" height="46" fill="url(#bSheen)" transform="skewX(-22)">
            <animate attributeName="x" values="-50;155;155" keyTimes="0;0.55;1" dur="3.2s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- Title & Version Pill -->
    <text x="172" y="74" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
      Huggy <tspan fill="#FFCC4D">PR Agent</tspan>
    </text>
    <rect x="442" y="48" width="52" height="26" rx="13" fill="#FFCC4D" fill-opacity="0.14" stroke="#FFCC4D" stroke-opacity="0.45" stroke-width="1.2"/>
    <text x="468" y="65.5" text-anchor="middle" fill="#FFCC4D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5" font-weight="700">@v1</text>

    <!-- Tagline -->
    <text x="172" y="106" fill="#E5E7EB" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.8" font-weight="500">
      Full-repo inline PR reviews, 1-click suggestions &amp; test-gated <tspan fill="#FFCC4D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.8">@huggy</tspan> auto-fixes.
    </text>
    <text x="172" y="129" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.2">
      Powered by Pi · Enforces your <tspan fill="#E5E7EB" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.8">AGENTS.md</tspan> · Scales to 10k+ LOC PRs with a Fact-Check Judge.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(172, 150)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.8" font-weight="600">
      <rect x="0" y="0" width="136" height="28" rx="7" fill="#181C26" stroke="#FFCC4D" stroke-opacity="0.40"/>
      <text x="68" y="18" text-anchor="middle" fill="#FFCC4D">Inline Hunk Guard</text>

      <rect x="144" y="0" width="142" height="28" rx="7" fill="#181C26" stroke="#2F3646"/>
      <text x="215" y="18" text-anchor="middle" fill="#E5E7EB">10k+ LOC Bundling</text>

      <rect x="294" y="0" width="136" height="28" rx="7" fill="#181C26" stroke="#2F3646"/>
      <text x="362" y="18" text-anchor="middle" fill="#E5E7EB">Fact-Check Judge</text>

      <rect x="438" y="0" width="154" height="28" rx="7" fill="#181C26" stroke="#2F3646"/>
      <text x="515" y="18" text-anchor="middle" fill="#E5E7EB">Vertex · OpenCode</text>
    </g>
  </g>

  <rect x="1" y="1" width="798" height="210" rx="18" fill="none" stroke="#FFCC4D" stroke-opacity="0.28" stroke-width="1.4"/>
</svg>
