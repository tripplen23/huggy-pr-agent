    <path d="M 12 1.5 L 244 1.5" stroke="#eab308" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="22" width="118" height="26" rx="13" fill="#eab308" fill-opacity="0.16" stroke="#eab308" stroke-width="1"/>
