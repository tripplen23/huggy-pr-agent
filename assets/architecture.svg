  </defs>

  <rect x="2" y="2" width="1196" height="276" rx="14" fill="url(#bg-arch)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Card 1: STEP 1 · PREP (x=28, w=256) -->
  <g transform="translate(28, 28)">
    <rect width="256" height="224" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <path d="M 12 1.5 L 244 1.5" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <rect x="20" y="22" width="118" height="26" rx="13" fill="#1f6feb" fill-opacity="0.16" stroke="#3b82f6" stroke-width="1"/>
