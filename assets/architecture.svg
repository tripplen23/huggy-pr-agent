    <text x="20" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Repo-Aware Review</text>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      <circle cx="26" cy="103" r="3" fill="#eab308"/><text x="38" y="107" fill="#c9d1d9">--no-context-files isolation</text>
      <circle cx="26" cy="131" r="3" fill="#eab308"/><text x="38" y="135" fill="#c9d1d9">rg caller &amp; contract search</text>
      <circle cx="26" cy="159" r="3" fill="#eab308"/><text x="38" y="163" fill="#c9d1d9">Check every &lt;review_files&gt;</text>
      <circle cx="26" cy="187" r="3" fill="#eab308"/><text x="38" y="191" fill="#c9d1d9">No GH_TOKEN in environment</text>
    </g>
  </g>

