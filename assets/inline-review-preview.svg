  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#e6edf3">
    <text x="36" y="298">Pinning the</text>
    <rect x="112" y="283" width="68" height="20" rx="4" fill="#21262d"/>
    <text x="146" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">command</text>
    <text x="186" y="298">checkout protects</text>
    <rect x="307" y="283" width="84" height="20" rx="4" fill="#21262d"/>
    <text x="349" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">action.yml</text>
    <text x="396" y="298">, but the composite's</text>
    <rect x="537" y="283" width="66" height="20" rx="4" fill="#21262d"/>
    <text x="570" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">prepare</text>
    <text x="610" y="298">step runs</text>
    <rect x="676" y="283" width="184" height="20" rx="4" fill="#21262d"/>
    <text x="768" y="297" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">git checkout -q pr-head</text>
    <text x="866" y="298">in the same</text>

    <text x="36" y="324">workspace and then invokes</text>
    <rect x="218" y="309" width="246" height="20" rx="4" fill="#21262d"/>
    <text x="341" y="323" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">$ACTION_PATH/scripts/post_review.py</text>
    <text x="472" y="324">with</text>
    <rect x="504" y="309" width="76" height="20" rx="4" fill="#21262d"/>
    <text x="542" y="323" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">GH_TOKEN</text>
    <text x="588" y="324">in env. Copy</text>
    <rect x="672" y="309" width="74" height="20" rx="4" fill="#21262d"/>
    <text x="709" y="323" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">scripts/</text>
    <text x="752" y="324">to</text>
    <rect x="770" y="309" width="108" height="20" rx="4" fill="#21262d"/>
    <text x="824" y="323" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#e6edf3">$RUNNER_TEMP</text>
    <text x="884" y="324">first.</text>
