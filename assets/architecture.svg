    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#8b949e">
      <circle cx="26" cy="103" r="3" fill="#3b82f6"/><text x="38" y="107" fill="#c9d1d9">Read AGENTS.md from base</text>
      <circle cx="26" cy="131" r="3" fill="#3b82f6"/><text x="38" y="135" fill="#c9d1d9">Filter lockfiles &amp; build noise</text>
      <circle cx="26" cy="159" r="3" fill="#3b82f6"/><text x="38" y="163" fill="#c9d1d9">Number diff lines (L123 +)</text>
      <circle cx="26" cy="187" r="3" fill="#3b82f6"/><text x="38" y="191" fill="#c9d1d9">Pull commits &amp; PR threads</text>
    </g>
  </g>

  <!-- Connector 1 -> 2 -->
  <g stroke="#8b949e" stroke-width="2" fill="none">
    <line x1="290" y1="140" x2="314" y2="140"/>
    <polyline points="309,135 316,140 309,145" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

