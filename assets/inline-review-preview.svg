  <circle cx="50" cy="512" r="13" fill="#161b22" stroke="#30363d"/>
  <circle cx="50" cy="512" r="7" fill="none" stroke="#8b949e" stroke-width="1.3"/>
  <circle cx="47.5" cy="510" r="1" fill="#8b949e"/>
