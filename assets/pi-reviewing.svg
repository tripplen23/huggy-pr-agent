<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 104" width="540" height="104" role="img" aria-label="Pi is reviewing this pull request">
  <defs>
    <linearGradient id="piGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <clipPath id="streamClip">
      <rect x="12" y="10" width="118" height="72"/>
    </clipPath>
    <clipPath id="barClip">
      <rect x="12" y="88" width="516" height="3" rx="1.5"/>
    </clipPath>
  </defs>

  <!-- Streaming diff tokens & pi digits gliding into Pi's paws -->
  <g clip-path="url(#streamClip)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">
    <g>
      <animateTransform attributeName="transform" type="translate" from="-90 0" to="115 0" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.82;1" dur="2.6s" repeatCount="indefinite"/>
      <rect x="6" y="24" width="34" height="18" rx="4" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-opacity="0.6"/>
      <text x="23" y="37" text-anchor="middle" fill="#22c55e">+fn</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-90 0" to="115 0" dur="2.6s" begin="0.85s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.82;1" dur="2.6s" begin="0.85s" repeatCount="indefinite"/>
      <rect x="6" y="48" width="38" height="18" rx="4" fill="#f59e0b" fill-opacity="0.16" stroke="#f59e0b" stroke-opacity="0.6"/>
      <text x="25" y="61" text-anchor="middle" fill="#f59e0b">3.14</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-90 0" to="115 0" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.82;1" dur="2.6s" begin="1.7s" repeatCount="indefinite"/>
      <rect x="6" y="28" width="34" height="18" rx="4" fill="#ef4444" fill-opacity="0.16" stroke="#ef4444" stroke-opacity="0.6"/>
      <text x="23" y="41" text-anchor="middle" fill="#ef4444">-bug</text>
    </g>
  </g>

  <!-- Cute ASCII Pi Mascot (bobs gently + blinks + floating golden pi sparkle) -->
  <g transform="translate(136, 14)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -2.5; 0 0" dur="1.4s" repeatCount="indefinite"/>

      <!-- Pi Hat / Crown -->
      <text x="34" y="16" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="800" fill="#f59e0b">╭─π─╮</text>

      <!-- Face (open eyes) -->
      <text x="34" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#8b949e">
        ( <tspan fill="#f59e0b">◕</tspan>‿<tspan fill="#f59e0b">◕</tspan> )
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.88;0.92;0.96;1" dur="3.4s" repeatCount="indefinite"/>
      </text>
      <!-- Face (blink frame) -->
      <text x="34" y="37" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="700" fill="#8b949e" opacity="0">
        ( <tspan fill="#f59e0b">─</tspan>‿<tspan fill="#f59e0b">─</tspan> )
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.88;0.92;0.96;1" dur="3.4s" repeatCount="indefinite"/>
      </text>

      <!-- Little paws holding a warm golden slice -->
      <text x="34" y="58" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" fill="#8b949e">c( <tspan fill="#eab308">∆</tspan> )っ</text>
    </g>

    <!-- Floating golden π thought sparkle -->
    <text x="68" y="14" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="800" fill="#f59e0b">
      π
      <animateTransform attributeName="transform" type="translate" values="0 2; 3 -7; 6 -13" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Right-side terminal status readout -->
  <g transform="translate(226, 36)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="0" y="0" font-size="13.5" font-weight="700" fill="#f59e0b">π-agent</text>
    <text x="66" y="0" font-size="13" fill="#8b949e">is tracing diffs &amp; callers</text>
    <text x="274" y="0" font-size="13" font-weight="700" fill="#f59e0b">
      ...
      <animate attributeName="opacity" values="0.25;1;0.25" dur="1.2s" repeatCount="indefinite"/>
    </text>

    <text x="0" y="23" font-size="11.5" fill="#6e7681">AGENTS.md rubric · hunk guard · judge pass</text>
  </g>

  <!-- Baseline & gliding golden progress bar -->
  <rect x="12" y="88" width="516" height="2" rx="1" fill="#6e7681" fill-opacity="0.3"/>
  <g clip-path="url(#barClip)">
    <rect x="-140" y="88" width="140" height="3" rx="1.5" fill="url(#piGold)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="660 0" dur="2.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
