<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#1f242d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <ellipse cx="600" cy="0" rx="520" ry="180" fill="url(#glow)"/>

  <!-- Subtle grid dots -->
  <g fill="#30363d" opacity="0.55">
    <circle cx="80" cy="60" r="2"/><circle cx="140" cy="60" r="2"/><circle cx="200" cy="60" r="2"/>
    <circle cx="80" cy="120" r="2"/><circle cx="140" cy="120" r="2"/><circle cx="200" cy="120" r="2"/>
    <circle cx="1000" cy="200" r="2"/><circle cx="1060" cy="200" r="2"/><circle cx="1120" cy="200" r="2"/>
    <circle cx="1000" cy="260" r="2"/><circle cx="1060" cy="260" r="2"/><circle cx="1120" cy="260" r="2"/>
  </g>

  <!-- Pi Badge Icon -->
  <g transform="translate(556, 38)">
    <rect width="88" height="88" rx="20" fill="#161b22" stroke="url(#accent)" stroke-width="2.5"/>
    <text x="44" y="62" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="52" font-weight="800" fill="url(#accent)">π</text>
  </g>

  <!-- Title -->
  <text x="600" y="176" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#f0f6fc" letter-spacing="-0.5">
    Pi PR Agent
  </text>

  <!-- Subtitle -->
  <text x="600" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">
    Deterministic Engineering × Repository-Aware Coding Agent for GitHub Pull Requests
  </text>

  <!-- Feature Pills -->
  <g transform="translate(215, 244)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600">
    <rect x="0" y="0" width="170" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <circle cx="20" cy="16" r="5" fill="#dc2626"/>
    <text x="34" y="20" fill="#e6edf3">Inline Diff Review</text>

    <rect x="186" y="0" width="196" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <circle cx="206" cy="16" r="5" fill="#facc15"/>
    <text x="220" y="20" fill="#e6edf3">1-Click Suggestions</text>

    <rect x="398" y="0" width="174" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <circle cx="418" cy="16" r="5" fill="#3b82f6"/>
    <text x="432" y="20" fill="#e6edf3">AGENTS.md Rubric</text>

    <rect x="588" y="0" width="182" height="32" rx="16" fill="#21262d" stroke="#30363d"/>
    <circle cx="608" cy="16" r="5" fill="#22c55e"/>
    <text x="622" y="20" fill="#e6edf3">@pi Test-Gated Fix</text>
  </g>
</svg>
