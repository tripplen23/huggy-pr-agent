  <rect x="850" y="454" width="138" height="28" rx="6" fill="#21262d" stroke="#30363d"/>
  <text x="919" y="472" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#c9d1d9">Add suggestion to batch</text>

