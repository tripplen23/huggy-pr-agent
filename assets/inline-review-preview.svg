    <text x="134" y="197" fill="#f0f6fc">+</text>
    <text x="176" y="197" fill="#f0f6fc">- </text>
    <text x="192" y="197" fill="#7ee787">uses</text>
    <text x="224" y="197" fill="#f0f6fc">: </text>
