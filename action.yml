name: "Pi PR Agent"
description: "Code review & PR automation powered by Pi: inline diff reviews, 1-click suggestions, /describe, /improve, /ask, and @pi."
author: "Binh Duc Nguyen"
branding:
  icon: "git-pull-request"
  color: "orange"

inputs:
  mode:
    description: "What to run: 'auto' (review on pull_request, slash/@pi commands on comments), 'review', or 'comment'."
    required: false
    default: "auto"
  api_key:
    description: "API key for the chosen model provider (e.g. OpenCode Go key, OpenRouter key)."
    required: true
  api_key_env:
    description: "Environment variable name Pi reads for the provider API key."
    required: false
    default: "OPENCODE_API_KEY"
  model:
    description: "Pi model identifier (`provider/model`)."
    required: false
    default: "opencode-go/deepseek-v4.1-flash"
  fallback_model:
    description: "Fallback model identifier tried when the primary model is overloaded (429/5xx)."
    required: false
    default: "opencode-go/glm-5.3-flash"
  thinking:
    description: "Thinking level (`off`, `minimal`, `low`, `medium`, `high`)."
    required: false
    default: "high"
  pi_version:
    description: "Version or dist-tag of @earendil-works/pi-coding-agent to install."
    required: false
    default: "latest"
  review_tools:
    description: "Comma-separated Pi tools enabled during read-only PR reviews."
    required: false
    default: "read,grep,find,ls"
  review_timeout_minutes:
    description: "Review timeout budget in minutes, or 'auto' to scale dynamically with PR size (18m to 50m)."
    required: false
    default: "auto"
  fix_timeout_minutes:
    description: "Per-attempt timeout in minutes for interactive @pi / /fix commands."
    required: false
    default: "25"
  max_parallel_bundles:
    description: "Maximum parallel Pi workers when reviewing large multi-bundle PRs."
    required: false
    default: "3"
  judge_pass:
    description: "Run an independent tool-free fact-checker pass to drop hallucinated or duplicate findings."
    required: false
    default: "true"
  skip_bots:
    description: "Skip automatic pull_request reviews when the PR author is a bot (e.g. Renovate, Dependabot)."
    required: false
    default: "true"
  skip_drafts:
    description: "Skip automatic pull_request reviews while the PR is in draft state."
    required: false
    default: "false"
  rubric_file:
    description: "Context file read from the base branch as the review/fix rubric (falls back to CLAUDE.md if absent)."
    required: false
    default: "AGENTS.md"
  extra_instructions:
    description: "Optional extra instructions appended to the prompt."
    required: false
    default: ""
  setup_cmd:
    description: "Shell command run in a secret-free step before a @pi fix (e.g. 'corepack enable pnpm && pnpm install --frozen-lockfile')."
    required: false
    default: ""
  verify_cmd:
    description: "Shell command run after a @pi / /fix edit before committing and pushing (e.g. 'pnpm typecheck && pnpm lint && pnpm test')."
    required: false
    default: ""
  guarded_paths:
    description: "Space-separated paths that a @pi / /fix run is not allowed to stage or push."
    required: false
    default: ".github .woodpecker Dockerfile docker-entrypoint.sh package.json pnpm-lock.yaml pnpm-workspace.yaml Cargo.lock go.mod go.sum migrations"
  github_token:
    description: "GitHub token used to post reviews/comments and push @pi fixes."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    # -------------------------------------------------------------------------
    # SHARED CACHE FOR PI CLI
    # -------------------------------------------------------------------------
    - name: Resolve concrete Pi CLI version
      id: pi_ver
      shell: bash
      env:
        PI_VERSION: ${{ inputs.pi_version }}
      run: |
        set -euo pipefail
        resolved=$(npm view "@earendil-works/pi-coding-agent@$PI_VERSION" version 2>/dev/null || printf '%s' "$PI_VERSION")
        echo "version=$resolved" >> "$GITHUB_OUTPUT"

    - name: Cache Pi CLI installation
      uses: actions/cache@v4
      with:
        path: ~/.pi-cli
        key: pi-cli-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.pi_ver.outputs.version }}

    # -------------------------------------------------------------------------
    # AUTOMATIC PR REVIEW (pull_request event)
    # -------------------------------------------------------------------------
    - name: Check whether PR review should run
      id: gate_review
      if: (inputs.mode == 'review') || (inputs.mode == 'auto' && github.event_name == 'pull_request')
      shell: bash
      env:
        SKIP_BOTS: ${{ inputs.skip_bots }}
        SKIP_DRAFTS: ${{ inputs.skip_drafts }}
        PR_USER_TYPE: ${{ github.event.pull_request.user.type }}
        PR_USER_LOGIN: ${{ github.event.pull_request.user.login }}
        PR_DRAFT: ${{ github.event.pull_request.draft }}
      run: |
        set -euo pipefail
        if [ "$SKIP_BOTS" = "true" ] && { [ "$PR_USER_TYPE" = "Bot" ] || [[ "$PR_USER_LOGIN" == *"[bot]" ]]; }; then
          echo "Skipping automatic review for bot PR author ($PR_USER_LOGIN)."
          echo "go=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$SKIP_DRAFTS" = "true" ] && [ "$PR_DRAFT" = "true" ]; then
          echo "Skipping automatic review for draft PR."
          echo "go=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "go=true" >> "$GITHUB_OUTPUT"

    - name: Checkout PR merge ref (review)
      if: steps.gate_review.outputs.go == 'true'
      uses: actions/checkout@v4
      with:
        fetch-depth: 2
        token: ${{ inputs.github_token }}

    - name: Resolve base branch, rubric and review context
      if: steps.gate_review.outputs.go == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        TARGET: ${{ github.event.pull_request.base.ref }}
        PR: ${{ github.event.pull_request.number }}
        RUBRIC_FILE: ${{ inputs.rubric_file }}
        EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/pi-action"
        mkdir -p "$RUNNER_TEMP/pi-action"
        cp -R "$ACTION_PATH/scripts" "$ACTION_PATH/prompts" "$RUNNER_TEMP/pi-action/"

        if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -ge 3 ]; then
          git branch -f base "HEAD^1"
        else
          git fetch --no-tags --depth=100 origin \
            "+refs/heads/$TARGET:refs/remotes/base" "+refs/pull/$PR/head:refs/remotes/pr-head"
          git checkout -q refs/remotes/pr-head
          mb=$(git merge-base refs/remotes/base refs/remotes/pr-head 2>/dev/null || true)
          if [ -z "$mb" ]; then
            echo "no merge base within 100 commits; refusing to review an inverted diff" >&2
            exit 1
          fi
          git branch -f base "$mb"
        fi
        echo "base = $(git rev-parse --short base)"

        if git cat-file -e "base:$RUBRIC_FILE" 2>/dev/null; then
          git show "base:$RUBRIC_FILE" > "$RUNNER_TEMP/rubric.md"
        elif git cat-file -e "base:CLAUDE.md" 2>/dev/null; then
          git show "base:CLAUDE.md" > "$RUNNER_TEMP/rubric.md"
        else
          : > "$RUNNER_TEMP/rubric.md"
        fi

        if git cat-file -e "base:.github/pi-review-prompt.md" 2>/dev/null; then
          git show "base:.github/pi-review-prompt.md" > "$RUNNER_TEMP/brief-template.md"
        else
          cp "$RUNNER_TEMP/pi-action/prompts/review.md" "$RUNNER_TEMP/brief-template.md"
        fi
        if [ -n "$EXTRA_INSTRUCTIONS" ]; then
          printf '\n\nAdditional repository instructions:\n%s\n' "$EXTRA_INSTRUCTIONS" >> "$RUNNER_TEMP/brief-template.md"
        fi

        git -c core.quotePath=false diff base HEAD > "$RUNNER_TEMP/diff.patch"
        python3 "$RUNNER_TEMP/pi-action/scripts/fetch_pr_context.py" "$RUNNER_TEMP/pr-context.md" "$RUNNER_TEMP/diff.patch"
        python3 "$RUNNER_TEMP/pi-action/scripts/post_progress.py"

    - name: Run Pi (review + judge)
      if: steps.gate_review.outputs.go == 'true'
      shell: bash
      env:
        PI_API_KEY: ${{ inputs.api_key }}
        PI_API_KEY_ENV: ${{ inputs.api_key_env }}
        PI_MODEL: ${{ inputs.model }}
        PI_FALLBACK_MODEL: ${{ inputs.fallback_model }}
        PI_THINKING: ${{ inputs.thinking }}
        PI_VERSION: ${{ inputs.pi_version }}
        PI_REVIEW_TOOLS: ${{ inputs.review_tools }}
        PI_REVIEW_TIMEOUT_MINUTES: ${{ inputs.review_timeout_minutes }}
        PI_MAX_PARALLEL_BUNDLES: ${{ inputs.max_parallel_bundles }}
        PI_JUDGE_PASS: ${{ inputs.judge_pass }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "$RUNNER_TEMP/pi-action/scripts/ensure_tools.sh"
        python3 "$RUNNER_TEMP/pi-action/scripts/run_review.py"

    - name: Publish inline review and sticky summary
      if: steps.gate_review.outputs.go == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -euo pipefail
        git -c core.quotePath=false diff base HEAD > "$RUNNER_TEMP/diff.patch"
        python3 "$RUNNER_TEMP/pi-action/scripts/post_review.py"

    - name: Replace a stale verdict when review fails
      if: failure() && steps.gate_review.outputs.go == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        set -euo pipefail
        auth="Authorization: Bearer $GH_TOKEN"
        api="https://api.github.com/repos/$REPO/issues"
        comments=$(curl -fsSL -H "$auth" "$api/$PR/comments?per_page=100")
        existing=$(printf '%s' "$comments" | jq -r 'first(.[] | select(.body | startswith("<!-- pi-review")) | .id) // empty')
        marker=$(printf '%s' "$comments" | jq -r 'first(.[] | select(.body | startswith("<!-- pi-review")) | (.body | split("\n")[0])) // "<!-- pi-review -->"')
        body=$(printf '%s\n## Review by Pi\n\nThis run did not finish, so any verdict above is from an older commit. The log says why: %s/%s/actions/runs/%s' \
          "$marker" "${{ github.server_url }}" "$REPO" "${{ github.run_id }}")
        payload=$(jq -n --arg b "$body" '{body: $b}')
        if [ -n "$existing" ]; then
          curl -fsSL -X PATCH -H "$auth" -H "Content-Type: application/json" \
            "$api/comments/$existing" -d "$payload" > /dev/null
        fi

    # -------------------------------------------------------------------------
    # INTERACTIVE PR COMMANDS (/review, /describe, /improve, /ask, /fix, @pi)
    # -------------------------------------------------------------------------
    - name: Parse command and check out PR branch
      id: prepare
      if: (inputs.mode == 'fix' || inputs.mode == 'comment') || (inputs.mode == 'auto' && (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment'))
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_ID: ${{ github.event.comment.id }}
        COMMENT_USER: ${{ github.event.comment.user.login }}
        COMMENT_USER_TYPE: ${{ github.event.comment.user.type }}
        COMMENT_ASSOC: ${{ github.event.comment.author_association }}
        COMMENT_PATH: ${{ github.event.comment.path || '' }}
        COMMENT_LINE: ${{ github.event.comment.line || github.event.comment.original_line || '' }}
        COMMENT_START_LINE: ${{ github.event.comment.start_line || github.event.comment.original_start_line || '' }}
        COMMENT_DIFF_HUNK: ${{ github.event.comment.diff_hunk || '' }}
        THREAD: ${{ github.event_name == 'pull_request_review_comment' && 'yes' || '' }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/pi-action"
        mkdir -p "$RUNNER_TEMP/pi-action"
        cp -R "$ACTION_PATH/scripts" "$ACTION_PATH/prompts" "$RUNNER_TEMP/pi-action/"

        python3 "$RUNNER_TEMP/pi-action/scripts/prepare_command.py" authorize
        grep -qx "go=true" "$GITHUB_OUTPUT" || exit 0
        cmd=$(sed -n 's/^cmd=//p' "$GITHUB_OUTPUT" | tail -n 1)

        api="https://api.github.com/repos/$REPO"
        auth="Authorization: Bearer $GH_TOKEN"

        if [ -n "$THREAD" ]; then
          react="$api/pulls/comments/$COMMENT_ID/reactions"
        else
          react="$api/issues/comments/$COMMENT_ID/reactions"
        fi
        curl -fsSL -X POST -H "$auth" -H "Content-Type: application/json" \
          "$react" -d '{"content":"eyes"}' > /dev/null \
          || echo "could not add reaction (cosmetic); carrying on."

        read -r branch base cross < <(curl -fsSL -H "$auth" "$api/pulls/$PR" \
          | jq -r '"\(.head.ref) \(.base.ref) \(.head.repo.full_name != .base.repo.full_name)"')
        : "${branch:?could not read the PR branch}"
        if [ "$cross" = "true" ] && [ "$cmd" = "fix" ]; then
          curl -fsSL -X POST -H "$auth" -H "Content-Type: application/json" \
            "$api/issues/$PR/comments" -d '{"body":"I cannot push to a fork branch with this token. Run `pi` on the branch locally, or open the PR from a branch in this repo."}' > /dev/null
          echo "go=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        git init -q .
        git fetch -q --no-tags "https://x-access-token:$GH_TOKEN@github.com/$REPO.git" \
          "+refs/pull/$PR/head:refs/heads/pr-head" "+refs/heads/$base:refs/heads/base-tip"
        git checkout -q pr-head
        mb=$(git merge-base base-tip pr-head 2>/dev/null || git rev-parse base-tip)
        git branch -f base "$mb"

        git -c core.quotePath=false diff base HEAD > "$RUNNER_TEMP/diff.patch"
        python3 "$RUNNER_TEMP/pi-action/scripts/fetch_pr_context.py" "$RUNNER_TEMP/pr-context.md" "$RUNNER_TEMP/diff.patch"
        python3 "$RUNNER_TEMP/pi-action/scripts/prepare_command.py" build-request "$RUNNER_TEMP/fix-request.md"
        if [ "$cmd" = "review" ]; then
          python3 "$RUNNER_TEMP/pi-action/scripts/post_progress.py"
        fi

    # Runs in its own step with neither GH_TOKEN nor PI_API_KEY in env, so
    # dependency lifecycle scripts (`postinstall`) from the PR branch cannot read
    # or exfiltrate any secret.
    - name: Set up project dependencies for fix
      if: steps.prepare.outputs.go == 'true' && steps.prepare.outputs.cmd == 'fix' && inputs.setup_cmd != ''
      shell: bash
      env:
        SETUP_CMD: ${{ inputs.setup_cmd }}
      run: |
        set -euo pipefail
        eval "$SETUP_CMD"

    - name: Run Pi (command)
      id: fix
      if: steps.prepare.outputs.go == 'true'
      shell: bash
      env:
        PI_API_KEY: ${{ inputs.api_key }}
        PI_API_KEY_ENV: ${{ inputs.api_key_env }}
        PI_MODEL: ${{ inputs.model }}
        PI_FALLBACK_MODEL: ${{ inputs.fallback_model }}
        PI_THINKING: ${{ inputs.thinking }}
        PI_VERSION: ${{ inputs.pi_version }}
        PI_REVIEW_TOOLS: ${{ inputs.review_tools }}
        PI_REVIEW_TIMEOUT_MINUTES: ${{ inputs.review_timeout_minutes }}
        PI_FIX_TIMEOUT_MINUTES: ${{ inputs.fix_timeout_minutes }}
        PI_MAX_PARALLEL_BUNDLES: ${{ inputs.max_parallel_bundles }}
        PI_JUDGE_PASS: ${{ inputs.judge_pass }}
        RUBRIC_FILE: ${{ inputs.rubric_file }}
        EXTRA_INSTRUCTIONS: ${{ inputs.extra_instructions }}
        COMMENT_BODY: ${{ github.event.comment.body }}
        COMMENT_ID: ${{ github.event.comment.id }}
        CMD: ${{ steps.prepare.outputs.cmd }}
      run: |
        set -euo pipefail
        [ -n "${PI_API_KEY:-}" ] || { echo "api_key input is empty" >&2; exit 1; }
        export "$PI_API_KEY_ENV=$PI_API_KEY"

        # shellcheck disable=SC1091
        source "$RUNNER_TEMP/pi-action/scripts/ensure_tools.sh"

        if git cat-file -e "base:$RUBRIC_FILE" 2>/dev/null; then
          git show "base:$RUBRIC_FILE" > "$RUNNER_TEMP/rubric.md"
        elif git cat-file -e "base:CLAUDE.md" 2>/dev/null; then
          git show "base:CLAUDE.md" > "$RUNNER_TEMP/rubric.md"
        else
          : > "$RUNNER_TEMP/rubric.md"
        fi

        if [ "$CMD" = "review" ]; then
          if git cat-file -e "base:.github/pi-review-prompt.md" 2>/dev/null; then
            git show "base:.github/pi-review-prompt.md" > "$RUNNER_TEMP/brief-template.md"
          else
            cp "$RUNNER_TEMP/pi-action/prompts/review.md" "$RUNNER_TEMP/brief-template.md"
          fi
          if [ -n "$EXTRA_INSTRUCTIONS" ]; then
            printf '\n\nAdditional repository instructions:\n%s\n' "$EXTRA_INSTRUCTIONS" >> "$RUNNER_TEMP/brief-template.md"
          fi
          python3 "$RUNNER_TEMP/pi-action/scripts/run_review.py"
          cp review.md "$RUNNER_TEMP/reply.md"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [ -f "$RUNNER_TEMP/fix-request.md" ]; then
          cp "$RUNNER_TEMP/fix-request.md" .pi-fix-request.md
        else
          printf '%s\n' "$COMMENT_BODY" > .pi-fix-request.md
        fi

        case "$CMD" in
          describe) cp "$RUNNER_TEMP/pi-action/prompts/describe.md" "$RUNNER_TEMP/brief.md" ;;
          improve)  cp "$RUNNER_TEMP/pi-action/prompts/improve.md" "$RUNNER_TEMP/brief.md" ;;
          ask)      cp "$RUNNER_TEMP/pi-action/prompts/ask.md" "$RUNNER_TEMP/brief.md" ;;
          fix)
            if git cat-file -e "base:.github/pi-fix-prompt.md" 2>/dev/null; then
              git show "base:.github/pi-fix-prompt.md" > "$RUNNER_TEMP/brief.md"
            else
              cp "$RUNNER_TEMP/pi-action/prompts/fix.md" "$RUNNER_TEMP/brief.md"
            fi
            ;;
        esac
        if [ -n "$EXTRA_INSTRUCTIONS" ]; then
          printf '\n\nAdditional repository instructions:\n%s\n' "$EXTRA_INSTRUCTIONS" >> "$RUNNER_TEMP/brief.md"
        fi
        if [ -s "$RUNNER_TEMP/pr-context.md" ]; then
          printf '\n\n' >> "$RUNNER_TEMP/brief.md"
          cat "$RUNNER_TEMP/pr-context.md" >> "$RUNNER_TEMP/brief.md"
        fi

        sys_args=()
        if [ -s "$RUNNER_TEMP/rubric.md" ]; then
          sys_args=(--append-system-prompt "$RUNNER_TEMP/rubric.md")
        fi

        tools="read,grep,find,ls,bash"
        if [ "$CMD" = "fix" ]; then
          tools="read,grep,find,ls,bash,edit,write"
        fi

        timeout_sec=$(( ${PI_FIX_TIMEOUT_MINUTES:-25} * 60 ))
        run_ok=0
        for candidate in "$PI_MODEL" "$PI_MODEL" "${PI_FALLBACK_MODEL:-}"; do
          [ -n "$candidate" ] || continue
          echo "Running $CMD with model: $candidate (thinking: $PI_THINKING, timeout: ${timeout_sec}s)"
          if perl -e 'alarm shift; exec @ARGV' "$timeout_sec" pi --print \
            --model "$candidate" \
            --thinking "$PI_THINKING" \
            --tools "$tools" \
            --no-extensions --no-mcp --no-skills \
            --no-context-files \
            --no-approve --no-session \
            "${sys_args[@]}" < "$RUNNER_TEMP/brief.md" | tee .pi-fix-reply.md && [ -s .pi-fix-reply.md ]; then
            run_ok=1
            break
          fi
          echo "Model $candidate failed or was overloaded (429/5xx); backing off 20s before retry/fallback..." >&2
          sleep 20
        done
        [ "$run_ok" -eq 1 ] || { echo "All model attempts failed" >&2; exit 1; }

        perl -pe 's/\Q$ENV{PI_API_KEY}\E/[redacted]/g' .pi-fix-reply.md > "$RUNNER_TEMP/reply.md"
        cp "$RUNNER_TEMP/reply.md" review.md
        rm -f .pi-fix-reply.md .pi-fix-request.md
        if [ "$CMD" = "fix" ] && [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Verify fix
      if: steps.fix.outputs.changed == 'true' && inputs.verify_cmd != ''
      shell: bash
      env:
        VERIFY_CMD: ${{ inputs.verify_cmd }}
      run: |
        set -euo pipefail
        eval "$VERIFY_CMD"

    - name: Publish command result
      if: success() && steps.prepare.outputs.go == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        COMMENT_ID: ${{ github.event.comment.id }}
        THREAD: ${{ github.event_name == 'pull_request_review_comment' && 'yes' || '' }}
        CMD: ${{ steps.prepare.outputs.cmd }}
        GUARDED_PATHS: ${{ inputs.guarded_paths }}
      run: |
        set -euo pipefail
        api="https://api.github.com/repos/$REPO"
        auth="Authorization: Bearer $GH_TOKEN"
        reply=$(cat "$RUNNER_TEMP/reply.md")

        if [ -n "$THREAD" ]; then
          post="$api/pulls/$PR/comments/$COMMENT_ID/replies"
        else
          post="$api/issues/$PR/comments"
        fi
        answer() {
          curl -fsSL -X POST -H "$auth" -H "Content-Type: application/json" \
            "$post" -d "$(jq -n --arg b "$1" '{body: $b}')" > /dev/null
        }

        if [ "$CMD" = "review" ] || [ "$CMD" = "improve" ]; then
          export HEAD_SHA="$(git rev-parse HEAD)"
          git -c core.quotePath=false diff base HEAD > "$RUNNER_TEMP/diff.patch"
          python3 "$RUNNER_TEMP/pi-action/scripts/post_review.py"
          exit 0
        fi

        if [ "$CMD" = "describe" ]; then
          python3 - <<'PY'
        import json, os, sys, urllib.request
        sys.path.insert(0, os.path.join(os.environ["RUNNER_TEMP"], "pi-action", "scripts"))
        import post_review
        repo, pr, token = os.environ["REPO"], os.environ["PR"], os.environ["GH_TOKEN"]
        url = f"https://api.github.com/repos/{repo}/pulls/{pr}"
        headers = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json", "Content-Type": "application/json", "User-Agent": "pi-pr-agent"}
        with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=30) as r:
            existing = (json.loads(r.read().decode("utf-8")) or {}).get("body") or ""
        reply = open(os.path.join(os.environ["RUNNER_TEMP"], "reply.md"), encoding="utf-8").read()
        merged = post_review.merge_pr_description(existing, reply)
        req = urllib.request.Request(url, data=json.dumps({"body": merged}).encode("utf-8"), headers=headers, method="PATCH")
        urllib.request.urlopen(req, timeout=30).read()
        PY
          answer "$(printf 'Updated the PR description:\n\n%s' "$reply")"
          exit 0
        fi

        if [ "$CMD" = "ask" ]; then
          answer "$reply"
          exit 0
        fi

        rm -rf .git/hooks
        git config --local --unset-all core.fsmonitor 2>/dev/null || true
        git config --local --unset-all core.hooksPath 2>/dev/null || true

        if [ "${{ steps.fix.outputs.changed }}" != "true" ]; then
          answer "$(printf 'No change made.\n\n%s' "$reply")"
          exit 0
        fi

        read -r branch default < <(curl -fsSL -H "$auth" "$api/pulls/$PR" \
          | jq -r '"\(.head.ref) \(.head.repo.default_branch)"')
        : "${branch:?could not read the PR branch}"
        case "$branch" in
          master|main|HEAD|refs/*|*/master|*/main) branch="" ;;
        esac
        if [ -z "$branch" ] || [ "$branch" = "$default" ]; then
          answer "Refusing to push: that is the default branch. Nothing was pushed."
          exit 1
        fi

        git add -A
        if [ -n "$GUARDED_PATHS" ]; then
          # shellcheck disable=SC2086
          touched=$(git diff --cached --name-only -- $GUARDED_PATHS)
          if [ -n "$touched" ]; then
            # shellcheck disable=SC2086
            git reset -q -- $GUARDED_PATHS
            answer "That fix wanted to change guarded build, dependency or migration files, which I do not touch ($(printf '%s' "$touched" | tr '\n' ' ')). Nothing was pushed; do it by hand."
            exit 1
          fi
        fi

        git -c core.hooksPath=/dev/null -c core.fsmonitor=false \
          -c user.name=Pi -c user.email=pi@noreply.github.com \
          commit -q -m "pi: $(head -n 1 "$RUNNER_TEMP/request.txt" | cut -c1-72)"
        remote_url="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
        if ! git push -q --no-verify "$remote_url" "HEAD:refs/heads/$branch"; then
          answer "The \`$branch\` branch advanced while the verification suite was running, so I did not push an unverified rebase. Reply \`@pi\` again to apply and verify on the new tip."
          exit 1
        fi

        sha=$(git rev-parse --short HEAD)
        answer "$(printf 'Pushed `%s` to `%s`.\n\n%s' "$sha" "$branch" "$reply")"

        if [ -n "$THREAD" ]; then
          python3 - <<'PY'
        import json, os, sys, urllib.request
        try:
            owner, name = os.environ["REPO"].split("/", 1)
            pr = int(os.environ["PR"])
            cid = int(os.environ["COMMENT_ID"])
            token = os.environ["GH_TOKEN"]
            headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json", "User-Agent": "pi-pr-agent"}
            q = """
            query($owner: String!, $name: String!, $pr: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $pr) {
                  reviewThreads(last: 100) {
                    nodes { id isResolved comments(last: 100) { nodes { databaseId } } }
                  }
                }
              }
            }
            """
            req = urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": q, "variables": {"owner": owner, "name": name, "pr": pr}}).encode("utf-8"), headers=headers, method="POST")
            with urllib.request.urlopen(req, timeout=20) as resp:
                nodes = (((json.loads(resp.read().decode("utf-8")).get("data") or {}).get("repository") or {}).get("pullRequest") or {}).get("reviewThreads", {}).get("nodes") or []
            for t in nodes:
                if not t or t.get("isResolved"):
                    continue
                ids = {c.get("databaseId") for c in ((t.get("comments") or {}).get("nodes") or []) if c}
                if cid in ids and t.get("id"):
                    m = "mutation($id: ID!) { resolveReviewThread(input: {threadId: $id}) { thread { isResolved } } }"
                    urllib.request.urlopen(urllib.request.Request("https://api.github.com/graphql", data=json.dumps({"query": m, "variables": {"id": t["id"]}}).encode("utf-8"), headers=headers, method="POST"), timeout=20).read()
                    break
        except Exception as exc:
            sys.stderr.write(f"warning: could not auto-resolve thread for comment {os.environ.get('COMMENT_ID')} ({exc})\n")
        PY
        fi

    - name: Report when @pi command fails
      if: failure() && steps.prepare.outputs.go == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number || github.event.pull_request.number }}
        COMMENT_ID: ${{ github.event.comment.id }}
        THREAD: ${{ github.event_name == 'pull_request_review_comment' && 'yes' || '' }}
        CMD: ${{ steps.prepare.outputs.cmd }}
        RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        api="https://api.github.com/repos/$REPO"
        auth="Authorization: Bearer $GH_TOKEN"
        if [ "$CMD" = "review" ]; then
          existing=$(curl -fsSL -H "$auth" "$api/issues/$PR/comments?per_page=100" \
            | jq -r '.[] | select(.body | startswith("<!-- pi-review")) | .id' | head -n 1 || true)
          if [ -n "$existing" ]; then
            payload=$(jq -n --arg run "$RUN" \
              '{body: ("<!-- pi-review -->\n## Review by Pi\n\nThis `/review` run did not finish, so any verdict above is from an older commit. The log says why: " + $run)}')
            curl -fsSL -X PATCH -H "$auth" -H "Content-Type: application/json" \
              "$api/issues/comments/$existing" -d "$payload" > /dev/null || true
          fi
        fi
        if [ -n "$THREAD" ]; then
          post="$api/pulls/$PR/comments/$COMMENT_ID/replies"
        else
          post="$api/issues/$PR/comments"
        fi
        curl -fsSL -X POST -H "$auth" -H "Content-Type: application/json" \
          "$post" -d "$(jq -n --arg b "Pi did not finish this one: a step failed, so nothing was pushed past the checks. The log says which: $RUN" '{body: $b}')" > /dev/null
